<body>
    <app-header></app-header>

    <div class="banner">
        <p>Kremasto zadovoljstvo<br>
        u svakom zalogaju</p>
    </div>

    <section class="about-pistachio">
        <div class="about-container">
            <div class="pistachio-grid">
                <div class="pistachio-card" *ngFor="let p of products">

                    <img
                    class="pistImg"
                    [ngSrc]="p.photos[0]"
                    loading="lazy"
                    width="200"
                    height="100"
                    [alt]="p.name"
                    />

                    <h3>{{ p.name }}</h3>

                    <p>{{ p.price }} RSD ({{ p.weight }}g)</p>

                    <button>
                    <i class="fas fa-shopping-cart"></i> Dodaj u korpu
                    </button>

                    <button [value]="p.id" (click)="gotoProduct(p)">
                    Saznaj više
                    </button>

                </div>

            </div>
        </div>
    </section>

    

    <app-footer></app-footer>
</body>
